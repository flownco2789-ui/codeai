<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeAI 강사 포털</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <script src="codeai-config.js?v=20260212"></script>
  <script src="codeai-api.js?v=20260212"></script>
  <style>
    body { background:#f7f8fb; }
    .card { border-radius:16px; }
    .muted { color:#6c757d; }
    .kpi-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(16,24,40,.06);border:1px solid rgba(16,24,40,.06);}
.kpi-title{font-size:12px;color:#6c757d;margin-bottom:4px;}
.kpi-value{font-size:22px;font-weight:700;line-height:1.1;}
.kpi-delta{font-size:12px;margin-top:6px;}
.chart-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(16,24,40,.06);border:1px solid rgba(16,24,40,.06);}
.canvas-wrap{height:140px;}
canvas{width:100%;height:140px;}
.section-title{font-weight:700;}
.badge-soft{background:#eef2ff;color:#374151;border:1px solid #e5e7eb;}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h3 class="mb-1">강사 포털</h3>
        <div class="muted">학생 선택 → 최근 12주 대시보드 → 주간보고서 작성(업서트)</div>
      </div>
      <div class="text-end d-flex gap-2 justify-content-end">
        <button id="btnLogout" type="button" class="btn btn-sm btn-outline-danger d-none">로그아웃</button>
        <a href="index.html" class="btn btn-sm btn-outline-secondary">홈으로</a>
      </div>
    </div>

    <div id="loginCard" class="card p-3 mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label">이메일</label>
          <input id="email" class="form-control" placeholder="teacher01@codeai.co.kr" />
        </div>
        <div class="col-md-5">
          <label class="form-label">비밀번호</label>
          <input id="password" class="form-control" type="password" placeholder="teacher1234!" />
        </div>
        <div class="col-md-2 d-grid">
          <button id="btnLogin" class="btn btn-primary">로그인</button>
        </div>
      </div>
      <div id="loginMsg" class="small muted mt-2"></div>
    </div>



    <div id="changePwCard" class="card p-3 mb-3 d-none">
      <div class="mb-2"><b>비밀번호 변경</b> <span class="muted small">(최초 로그인 시 필수)</span></div>
      <div class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label">새 비밀번호</label>
          <input id="newPw" class="form-control" type="password" placeholder="8자 이상 권장" />
        </div>
        <div class="col-md-5">
          <label class="form-label">새 비밀번호 확인</label>
          <input id="newPw2" class="form-control" type="password" />
        </div>
        <div class="col-md-2 d-grid">
          <button id="btnChangePw" class="btn btn-primary">변경</button>
        </div>
      </div>
      <div id="changePwMsg" class="small muted mt-2"></div>
    </div>
    <div id="app" class="d-none">
      <div class="card p-3 mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-8">
            <label class="form-label mb-1">담당 학생(Enrollment)</label>
            <select id="enrSel" class="form-select"></select>
          <div id="enrInfo" class="muted" style="margin-top:6px"></div>
          </div>
          <div class="col-md-4 d-grid">
            <button id="btnRefresh" class="btn btn-outline-primary">새로고침</button>
          </div>
        </div>
        <div id="msg" class="small muted mt-2"></div>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div><b>최근 12주</b> <span class="muted small">(작성/대기/승인/반려)</span></div>
              <div class="muted small" id="count"></div>
            </div>
            <div id="dash" class="mb-3"></div>
        <div id="weeklyList"></div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card p-3">
            <div class="mb-2"><b>주간 학습보고서 작성</b></div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">주 시작일(월요일) - 비우면 이번 주</label>
                <input id="weekStartDate" type="date" class="input" />
              </div>
              <div class="col-6">
                <label class="form-label mb-1">출석(1~3)</label>
                <input id="attendance" class="form-control" type="number" min="0" max="7" />
              </div>
              <div class="col-6">
                <label class="form-label mb-1">숙제완료(%)</label>
                <input id="homework" class="form-control" type="number" min="0" max="100" />
              </div>
              <div class="col-6">
                <label class="form-label mb-1">집중도(%)</label>
                <input id="focus" class="form-control" type="number" min="0" max="100" />
              </div>
              <div class="col-6">
                <label class="form-label mb-1">오답수</label>
                <input id="mistakes" class="form-control" type="number" min="0" max="99" />
              </div>
              <div class="col-12">
                <label class="form-label mb-1">알고 점수</label>
                <input id="algoScore" class="form-control" type="number" min="0" max="100" />
              </div>
              <div class="col-12">
                <label class="form-label mb-1">프로젝트/피드백</label>
                <textarea id="projectFeedback" class="form-control" rows="3"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">강사 코멘트</label>
                <textarea id="instructorComment" class="form-control" rows="3"></textarea>
              </div>
              <div class="col-12 d-grid">
                <button id="btnSave" class="btn btn-primary">저장(업서트)</button>
              </div>
            </div>
            <div id="saveMsg" class="small muted mt-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="instructor-app.js?v=20260212d"></script>
</body>
</html>
