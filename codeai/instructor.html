<script>
/* codeaiNavToggle v1 - minimal hamburger menu toggle (no external deps) */
(function(){
  const navbar = document.querySelector('#navbar');
  const toggle = document.querySelector('.mobile-nav-toggle');
  if(!navbar || !toggle) return;

  function closeNav(){
    navbar.classList.remove('navbar-mobile');
    toggle.classList.remove('bi-x');
    toggle.classList.add('bi-list');
  }

  toggle.addEventListener('click', function(){
    navbar.classList.toggle('navbar-mobile');
    toggle.classList.toggle('bi-list');
    toggle.classList.toggle('bi-x');
  });

  // close menu after click
  navbar.addEventListener('click', function(e){
    const a = e.target.closest('a');
    if(!a) return;
    if(navbar.classList.contains('navbar-mobile')) closeNav();
  });

  // close when clicking outside
  document.addEventListener('click', function(e){
    if(!navbar.classList.contains('navbar-mobile')) return;
    const inNav = e.target.closest('#navbar');
    if(inNav) return;
    closeNav();
  });
})();
</script>
