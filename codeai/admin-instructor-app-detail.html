<!DOCTYPE html>
<html lang="ko">
<head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1" /> <title>강사 지원 상세정보</title> <link rel="icon" href="assets/img/favicon.png" /> <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"> <script src="codeai-config.js?v=20260213a"></script> <script src="codeai-api.js?v=20260213a"></script> <style> body { background:#f7f8fb; } .card { border-radius:16px; } .kv { display:grid; grid-template-columns: 140px 1fr; gap:.25rem .75rem; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } img.photo { width:120px; height:120px; object-fit:cover; border-radius:16px; border:1px solid #e9ecef; } </style>
</head>
<body class="p-3"> <div class="container" style="max-width: 920px;"> <div class="d-flex justify-content-between align-items-center mb-3"> <div class="d-flex gap-2 align-items-center"> <a class="btn btn-sm btn-outline-secondary" href="admin.html">← 관리자 홈</a> </div> <button id="btnLogout" class="btn btn-sm btn-outline-danger">로그아웃</button> </div> <div id="loginCard" class="card p-3 mb-3 d-none"> <div class="row g-2 align-items-end"> <div class="col-md-5"> <label class="form-label mb-1">이메일</label> <input id="email" class="form-control" placeholder="admin@example.com" /> </div> <div class="col-md-5"> <label class="form-label mb-1">비밀번호</label> <input id="password" type="password" class="form-control" placeholder="••••••••" /> </div> <div class="col-md-2 d-grid"> <button id="btnLogin" class="btn btn-primary">로그인</button> </div> </div> <div id="loginMsg" class="small text-danger mt-2"></div> </div> <div id="app" class="card p-3"> <div class="d-flex gap-3 align-items-start"> <img id="photo" class="photo d-none" alt="photo" /> <div class="flex-grow-1"> <h5 class="mb-2">강사 지원 상세정보</h5> <div id="msg" class="small text-muted mb-2">불러오는 중…</div> <div id="kv" class="kv"></div> </div> </div> </div> </div> <script>
(function{ const $ = (id)=>document.getElementById(id); const TOKEN_KEY = "codeai_admin_token"; const esc = (s)=>String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); function showLogin(msg){ $("loginCard").classList.remove("d-none"); $("app").classList.add("d-none"); if(msg) $("loginMsg").textContent = msg; } function showApp{ $("loginCard").classList.add("d-none"); $("app").classList.remove("d-none"); $("loginMsg").textContent = ""; } function doLogout(reason){ localStorage.removeItem(TOKEN_KEY); showLogin(reason || "로그아웃 되었습니다."); } $("btnLogout")?.addEventListener("click", (e)=>{ e.preventDefault; doLogout; }); function isAuthError(e){ const m = (e && e.message) ? String(e.message) : ""; return m==="NO_TOKEN" || m==="INVALID_TOKEN" || m.includes("INVALID_TOKEN") || m.includes("NO_TOKEN") || m.includes("Unauthorized") || m.includes("401"); } async function auth(path, opts){ try { return await CodeAI.authRequest(path, TOKEN_KEY, opts); } catch(e) { if(isAuthError(e)) { doLogout("세션이 만료되어 로그아웃되었습니다. 다시 로그인해주세요."); } throw e; } } async function login{ $("loginMsg").textContent = "로그인 중…"; try{ const out = await CodeAI.request("/api/v1/admin/auth/login", { method:"POST", body: JSON.stringify({ email: $("email").value.trim, password: $("password").value }) }); localStorage.setItem(TOKEN_KEY, out.token); showApp; $("loginMsg").textContent = ""; await load; }catch(e){ $("loginMsg").textContent = "로그인 실패: " + (e.message || "아이디/비밀번호를 확인해주세요."); } } $("btnLogin").addEventListener("click", login); function getId{ const id = new URLSearchParams(location.search).get("id"); return id; } function renderKV(obj){ const kv = $("kv"); kv.innerHTML = ""; const keys = Object.keys(obj || {}); keys.forEach(k=>{ const v = obj[k]; const keyEl = document.createElement("div"); keyEl.className = "text-muted small"; keyEl.textContent = k; const valEl = document.createElement("div"); valEl.className = "mono"; valEl.textContent = (v===null||v===undefined) ? "" : String(v); kv.appendChild(keyEl); kv.appendChild(valEl); }); } async function load{ const id = getId; if(!id){ $("msg").textContent = "id 파라미터가 없습니다."; return; } $("msg").textContent = "불러오는 중…"; const data = await auth(`/api/v1/admin/instructor-applications/${encodeURIComponent(getId)}`); $("msg").textContent = ""; const photoUrl = data?.photo_url || data?.photo || data?.photoUrl; if(photoUrl){ const img = $("photo"); img.src = photoUrl; img.classList.remove("d-none"); } // 사진 필드 제외하고 표시 const clone = Object.assign({}, data || {}); delete clone.photo_url; delete clone.photo; delete clone.photoUrl; renderKV(clone); } (async =>{ if(localStorage.getItem(TOKEN_KEY)) { showApp; try{ await load; }catch(e){ /* handled */ } } else { showLogin; } });
});
</script>
</body>
</html>
