<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeAI 관리자</title>
  <link rel="icon" href="assets/img/favicon.png" />
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <script src="codeai-config.js"></script>
  <script src="codeai-api.js"></script>
  <style>
    body { background:#f7f8fb; }
    .card { border-radius:16px; }
    .muted { color:#6c757d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .smallbtn { padding:.25rem .5rem; font-size:.85rem; }
    .tabpane { padding-top: 1rem; }
    .row-actions button { margin-right:.25rem; margin-bottom:.25rem; }
    .kv { display:grid; grid-template-columns: 140px 1fr; gap:.35rem .75rem; }
    .kv div:nth-child(odd){ color:#6c757d; }
    .avatar { width:64px; height:64px; border-radius:12px; object-fit:cover; border:1px solid #e6e8ef; background:#fff; }
    .avatar-sm { width:36px; height:36px; border-radius:10px; object-fit:cover; border:1px solid #e6e8ef; background:#fff; }
    .table td, .table th { vertical-align: middle; }
    .navbtn { cursor:pointer; }
    .badge-soft { background:#eef2ff; color:#3730a3; border:1px solid #e0e7ff; }
  </style>
</head>
<body>
  <div class="container py-4">

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center">
        <h3 class="mb-0 me-2">관리자</h3>
        <span class="badge badge-soft">CodeAI</span>
      </div>
      <div class="d-flex align-items-center">
        <button id="btnLogout" class="btn btn-sm btn-outline-danger ms-2 d-none">로그아웃</button>
      </div>
    </div>

    <div id="loginCard" class="card p-4 mb-3">
      <h5 class="mb-3">관리자 로그인</h5>
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label">이메일</label>
          <input id="loginEmail" class="form-control" placeholder="admin@example.com" />
        </div>
        <div class="col-md-4">
          <label class="form-label">비밀번호</label>
          <input id="loginPassword" type="password" class="form-control" placeholder="********" />
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button id="btnLogin" class="btn btn-primary w-100">로그인</button>
        </div>
      </div>
      <div class="mt-3 small text-danger" id="loginMsg"></div>
    </div>

    <div id="app" class="card p-4 d-none">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <button class="btn btn-outline-secondary btn-sm navbtn" data-tab="dashboard">대시보드</button>
        <button class="btn btn-outline-secondary btn-sm navbtn" data-tab="instructors">강사</button>
        <button class="btn btn-outline-secondary btn-sm navbtn" data-tab="instApps">강사지원</button>
        <button class="btn btn-outline-secondary btn-sm navbtn" data-tab="enrollments">학생신청</button>
        <button class="btn btn-outline-secondary btn-sm navbtn" data-tab="reports">보고서 승인</button>
        <button class="btn btn-outline-secondary btn-sm navbtn" data-tab="students">학생관리</button>
      </div>

      <hr class="my-3"/>

      <div id="tab-dashboard" class="tabpane"></div>
      <div id="tab-instructors" class="tabpane d-none"></div>
      <div id="tab-enrollments" class="tabpane d-none"></div>
      <div id="tab-reports" class="tabpane d-none"></div>
      <div id="tab-instApps" class="tabpane d-none"></div>
      <div id="tab-students" class="tabpane d-none"></div>
    </div>
  </div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const TOKEN_KEY = "codeai_admin_token";

  const TYPE_KO = {
    "ANY":"무관",
    "female":"여강사",
    "male":"남강사",
    "online":"온라인",
    "offline":"대면",
    "FEMALE":"여강사",
    "MALE":"남강사"
  };
  const STATUS_KO = {
    "PENDING":"대기",
    "APPROVED":"승인",
    "REJECTED":"거절",
    "MATCHED":"매칭완료",
    "CANCELED":"취소",
    "pending":"대기",
    "approved":"승인",
    "rejected":"거절",
    "matched":"매칭완료",
    "canceled":"취소"
  };
  function toKo(map, v){
    if(v===null||v===undefined||v==="") return "-";
    return map[String(v)] || String(v);
  }

  function showLogin(msg){
    $("loginCard").classList.remove("d-none");
    $("app").classList.add("d-none");
    $("btnLogout")?.classList.add("d-none");
    if(msg) $("loginMsg").textContent = msg;
  }
  function showApp(){
    $("loginCard").classList.add("d-none");
    $("app").classList.remove("d-none");
    $("btnLogout")?.classList.remove("d-none");
    $("loginMsg").textContent = "";
  }

  function doLogout(reason){
    try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
    // 로그인 화면으로 전환
    try{ showLogin(reason || "로그아웃 되었습니다."); }catch(e){}
    // 상태/캐시 꼬임 방지: 강제 이동
    try{ window.location.replace("admin.html?logout=1"); }catch(e){}
  }

  // ---- 안전장치: 스택 오버플로우(무한 재귀) 발생 시 자동 로그아웃 + 로그인 화면 ----
  function isMaxCallStack(err){
    const msg = (err && (err.message || err.toString())) ? String(err.message || err.toString()) : "";
    return /Maximum call stack size exceeded/i.test(msg);
  }

  window.addEventListener("error", function(ev){
    try{
      const err = ev && (ev.error || ev);
      if(isMaxCallStack(err)){
        doLogout("오류가 발생하여 로그아웃되었습니다. (Maximum call stack)");
      }
    }catch(e){}
  });

  window.addEventListener("unhandledrejection", function(ev){
    try{
      const err = ev && (ev.reason || ev);
      if(isMaxCallStack(err)){
        doLogout("오류가 발생하여 로그아웃되었습니다. (Maximum call stack)");
      }
    }catch(e){}
  });

  function isAuthError(e){
    const m = (e && e.message) ? String(e.message) : "";
    return m==="NO_TOKEN" || m==="INVALID_TOKEN" || m.includes("INVALID_TOKEN") ||
           (e && e.code && (e.code==="NO_TOKEN" || e.code==="INVALID_TOKEN")) ||
           (e && e.status===401);
  }

  function getToken(){
    try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; }
  }

  async function authRequest(method, path, body){
    const token = getToken();
    if(!token) throw new Error("NO_TOKEN");
    try{
      return await CodeAI.authRequest(method, path, token, body);
    }catch(e){
      if(isAuthError(e)) {
        doLogout("세션이 만료되어 로그아웃되었습니다. 다시 로그인해주세요.");
      }
      throw e;
    }
  }

  function setActiveTab(tab){
    const tabs = ["dashboard","instructors","instApps","enrollments","reports","students"];
    tabs.forEach(t=>{
      const el = $("tab-"+t);
      if(!el) return;
      if(t===tab) el.classList.remove("d-none");
      else el.classList.add("d-none");
    });
  }

  async function renderDashboard(){
    const el = $("tab-dashboard");
    el.innerHTML = `
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h5 class="mb-1">요약</h5>
          <div class="muted small">최근 신청/보고서 상태 요약</div>
        </div>
        <div class="small muted">관리자</div>
      </div>
      <hr/>
      <div class="muted">로딩중...</div>
    `;

    try{
      const stats = await authRequest("GET", "/api/v1/public/stats");
      el.innerHTML = `
        <div class="row g-3">
          <div class="col-md-4"><div class="card p-3"><div class="muted small">강사 수</div><div class="fs-4">${stats?.instructors ?? "-"}</div></div></div>
          <div class="col-md-4"><div class="card p-3"><div class="muted small">학생 신청</div><div class="fs-4">${stats?.enrollments ?? "-"}</div></div></div>
          <div class="col-md-4"><div class="card p-3"><div class="muted small">주간 보고서</div><div class="fs-4">${stats?.weeklyReports ?? "-"}</div></div></div>
        </div>
      `;
    }catch(e){
      el.innerHTML = `<div class="text-danger small">대시보드 로딩 실패: ${(e && e.message) ? e.message : e}</div>`;
    }
  }

  async function renderInstructors(){
    const el = $("tab-instructors");
    el.innerHTML = `<div class="muted">로딩중...</div>`;
    try{
      const list = await authRequest("GET", "/api/v1/admin/instructors");
      const rows = (list || []).map(x=>{
        const photo = x.photo_url ? `<img class="avatar-sm me-2" src="${x.photo_url}"/>` : `<div class="avatar-sm me-2" style="display:inline-block;"></div>`;
        return `
          <tr>
            <td class="mono small">${x.id}</td>
            <td>
              <a href="admin-instructor-detail.html?id=${encodeURIComponent(x.id)}" class="text-decoration-none">
                ${photo}<strong>${x.name || "-"}</strong>
              </a>
              <div class="small muted">${x.email || ""}</div>
            </td>
            <td>${x.phone || "-"}</td>
            <td>${x.region || "-"}</td>
            <td>${x.type || "-"}</td>
          </tr>
        `;
      }).join("");

      el.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">강사 목록</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead><tr>
              <th>ID</th><th>강사</th><th>전화</th><th>지역</th><th>타입</th>
            </tr></thead>
            <tbody>${rows || `<tr><td colspan="5" class="muted">데이터 없음</td></tr>`}</tbody>
          </table>
        </div>
      `;
    }catch(e){
      el.innerHTML = `<div class="text-danger small">강사 로딩 실패: ${(e && e.message) ? e.message : e}</div>`;
    }
  }

  async function renderInstructorApps(){
    const el = $("tab-instApps");
    el.innerHTML = `<div class="muted">로딩중...</div>`;
    try{
      const list = await authRequest("GET", "/api/v1/admin/instructor-applications");
      const rows = (list || []).map(x=>{
        return `
          <tr>
            <td class="mono small">${x.id}</td>
            <td>
              <a href="admin-instructor-app-detail.html?id=${encodeURIComponent(x.id)}" class="text-decoration-none">
                <strong>${x.name || "-"}</strong>
              </a>
              <div class="small muted">${x.email || ""}</div>
            </td>
            <td>${x.phone || "-"}</td>
            <td>${x.region || "-"}</td>
            <td>${x.status || "-"}</td>
          </tr>
        `;
      }).join("");

      el.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">강사지원</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead><tr>
              <th>ID</th><th>지원자</th><th>전화</th><th>지역</th><th>상태</th>
            </tr></thead>
            <tbody>${rows || `<tr><td colspan="5" class="muted">데이터 없음</td></tr>`}</tbody>
          </table>
        </div>
      `;
    }catch(e){
      el.innerHTML = `<div class="text-danger small">강사지원 로딩 실패: ${(e && e.message) ? e.message : e}</div>`;
    }
  }

  async function renderEnrollments(){
    const el = $("tab-enrollments");
    el.innerHTML = `<div class="muted">로딩중...</div>`;
    try{
      const list = await authRequest("GET", "/api/v1/admin/student-applications");
      const rows = (list || []).map(x=>{
        const preferred = toKo(TYPE_KO, x.preferred_instructor_type || x.preferredInstructorType || x.preferred_type);
        const st = toKo(STATUS_KO, x.status);
        return `
          <tr>
            <td class="mono small">${x.id}</td>
            <td>
              <a href="admin-student-detail.html?id=${encodeURIComponent(x.id)}" class="text-decoration-none">
                <strong>${x.name || "-"}</strong>
              </a>
              <div class="small muted">${x.phone || ""}</div>
            </td>
            <td>${x.target || "-"}</td>
            <td>${preferred}</td>
            <td>${st}</td>
          </tr>
        `;
      }).join("");

      el.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">학생 신청</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead><tr>
              <th>ID</th><th>학생</th><th>대상</th><th>선호타입</th><th>상태</th>
            </tr></thead>
            <tbody>${rows || `<tr><td colspan="5" class="muted">데이터 없음</td></tr>`}</tbody>
          </table>
        </div>
      `;
    }catch(e){
      el.innerHTML = `<div class="text-danger small">학생신청 로딩 실패: ${(e && e.message) ? e.message : e}</div>`;
    }
  }

  async function renderReports(){
    const el = $("tab-reports");
    el.innerHTML = `<div class="muted">로딩중...</div>`;
    try{
      const list = await authRequest("GET", "/api/v1/admin/reports");
      const rows = (list || []).map(x=>{
        return `
          <tr>
            <td class="mono small">${x.id}</td>
            <td>${x.enrollment_id || "-"}</td>
            <td>${x.week_start || "-"}</td>
            <td>${x.status || "-"}</td>
            <td class="row-actions">
              <button class="btn btn-sm btn-outline-success smallbtn" data-approve="${x.id}">승인</button>
              <button class="btn btn-sm btn-outline-danger smallbtn" data-reject="${x.id}">반려</button>
            </td>
          </tr>
        `;
      }).join("");

      el.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">보고서 승인</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead><tr>
              <th>ID</th><th>등록ID</th><th>주차</th><th>상태</th><th>처리</th>
            </tr></thead>
            <tbody>${rows || `<tr><td colspan="5" class="muted">데이터 없음</td></tr>`}</tbody>
          </table>
        </div>
      `;

      // 이벤트 바인딩
      el.querySelectorAll("[data-approve]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-approve");
          try{
            await authRequest("PUT", `/api/v1/admin/reports/${id}/review`, { action:"approve" });
            await renderReports();
          }catch(e){
            alert("승인 실패: " + ((e && e.message) ? e.message : e));
          }
        });
      });
      el.querySelectorAll("[data-reject]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-reject");
          try{
            await authRequest("PUT", `/api/v1/admin/reports/${id}/review`, { action:"reject" });
            await renderReports();
          }catch(e){
            alert("반려 실패: " + ((e && e.message) ? e.message : e));
          }
        });
      });

    }catch(e){
      el.innerHTML = `<div class="text-danger small">보고서 로딩 실패: ${(e && e.message) ? e.message : e}</div>`;
    }
  }

  async function renderStudents(){
    const el = $("tab-students");
    el.innerHTML = `<div class="muted">준비중...</div>`;
  }

  async function refreshTab(tab){
    if(tab==="dashboard") return renderDashboard();
    if(tab==="instructors") return renderInstructors();
    if(tab==="instApps") return renderInstructorApps();
    if(tab==="enrollments") return renderEnrollments();
    if(tab==="reports") return renderReports();
    if(tab==="students") return renderStudents();
  }

  // 네비게이션
  document.querySelectorAll(".navbtn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const tab = btn.getAttribute("data-tab");
      setActiveTab(tab);
      await refreshTab(tab);
    });
  });

  // 로그인
  $("btnLogin").addEventListener("click", async ()=>{
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value.trim();
    $("loginMsg").textContent = "";

    try{
      const r = await CodeAI.request("POST", "/api/v1/admin/login", { email, password });
      if(r && r.token){
        localStorage.setItem(TOKEN_KEY, r.token);
        showApp();
        setActiveTab("dashboard");
        await renderDashboard();
      }else{
        showLogin("로그인 실패: 토큰이 없습니다.");
      }
    }catch(e){
      const msg = (e && e.message) ? e.message : "로그인 실패";
      showLogin(msg);
    }
  });

  // 초기화
  (function init(){
    try{
      const qs = new URLSearchParams(location.search);
      if(qs.get("logout")==="1"){
        showLogin("로그아웃 되었습니다.");
        return;
      }
    }catch(e){}
    const token = getToken();
    if(!token){
      showLogin("");
      return;
    }
    showApp();
    setActiveTab("dashboard");
    renderDashboard();
  })();

})();
</script>

<script>
(function(){
  // logout=1 쿼리로 들어오면 무조건 로그인 화면
  try{
    var qs = new URLSearchParams(location.search);
    if(qs.get("logout")==="1"){
      try{ if(typeof showLogin==="function") showLogin("로그아웃 되었습니다."); }catch(e){}
    }
  }catch(e){}

  function hardLogout(){
    try{
      localStorage.removeItem("codeai_admin_token");
      localStorage.removeItem("access_token");
      localStorage.removeItem("admin_token");
      localStorage.removeItem("token");
      sessionStorage.clear();
    }catch(e){}
    try{ if(typeof showLogin==="function") showLogin("로그아웃 되었습니다."); }catch(e){}
    window.location.replace("/admin.html?logout=1&ts="+Date.now());
  }

  function bindLogout(){
    // id 기반(정식)
    var btn = document.getElementById("btnLogout");
    if(btn){
      btn.addEventListener("click", function(e){
        e.preventDefault();
        if(typeof doLogout==="function") doLogout("로그아웃 되었습니다.");
        else hardLogout();
      });
      return;
    }
    // 텍스트 기반(비상)
    var els = Array.from(document.querySelectorAll("a,button"));
    var target = els.find(function(el){
      return (el.textContent||"").trim().includes("로그아웃");
    });
    if(target){
      target.addEventListener("click", function(e){
        e.preventDefault();
        if(typeof doLogout==="function") doLogout("로그아웃 되었습니다.");
        else hardLogout();
      });
    }
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded", bindLogout);
  }else{
    bindLogout();
  }

  // 디버깅용
  window.hardLogout = hardLogout;
})();
</script>

<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
