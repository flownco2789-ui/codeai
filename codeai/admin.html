<!DOCTYPE html>
<html lang="ko">
<head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1" /> <title>CodeAI 관리자</title> <link rel="icon" href="assets/img/favicon.png" /> <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"> <script src="codeai-config.js?v=20260213a"></script> <script src="codeai-api.js?v=20260213a"></script> <style> body { background:#f7f8fb; } .card { border-radius:16px; } .muted { color:#6c757d; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; } .smallbtn { padding:.25rem .5rem; font-size:.85rem; } .tabpane { padding-top: 1rem; } .row-actions button { margin-right:.25rem; margin-bottom:.25rem; } .kv { display:grid; grid-template-columns: 120px 1fr; gap:.25rem .75rem; } </style>
</head>
<body> <div class="container py-4"> <div class="d-flex align-items-center justify-content-between mb-3"> <div> <h3 class="mb-1">관리자 페이지 (A안)</h3> <div class="muted">검색/배정 · 메인강사 · 학부모코드 로그/재발급 · 주간 학습보고서 검수</div> </div> <div class="text-end"> <a href="index.html" class="btn btn-sm btn-outline-secondary">홈으로</a> <button id="btnLogout" class="btn btn-sm btn-outline-danger ms-2 d-none">로그아웃</button> </div> </div> <div id="loginCard" class="card p-3 mb-3"> <div class="row g-2 align-items-end"> <div class="col-md-5"> <label class="form-label">이메일</label> <input id="email" class="form-control" placeholder="superadmin@codeai.co.kr" /> </div> <div class="col-md-5"> <label class="form-label">비밀번호</label> <input id="password" class="form-control" type="password" placeholder="admin1234!" /> </div> <div class="col-md-2 d-grid"> <button id="btnLogin" class="btn btn-primary">로그인</button> </div> </div> <div id="loginMsg" class="small muted mt-2"></div> </div> <div id="app" class="card p-3 d-none"> <ul class="nav nav-pills gap-2"> <li class="nav-item"><button class="nav-link active" data-tab="enrollments">수강/배정</button></li> <li class="nav-item"><button class="nav-link" data-tab="instructors">강사</button></li> <li class="nav-item"><button class="nav-link" data-tab="weekly">주간보고서</button></li> <li class="nav-item"><button class="nav-link" data-tab="reports">기존리포트</button></li> <li class="nav-item"><button class="nav-link" data-tab="instApps">강사지원</button></li> <li class="nav-item"><button class="nav-link" data-tab="students">학생신청</button></li> <li class="nav-item"><button class="nav-link" data-tab="notifications">알림로그</button></li> </ul> <div id="tab-enrollments" class="tabpane"></div> <div id="tab-instructors" class="tabpane d-none"></div> <div id="tab-weekly" class="tabpane d-none"></div> <div id="tab-reports" class="tabpane d-none"></div> <div id="tab-instApps" class="tabpane d-none"></div> <div id="tab-students" class="tabpane d-none"></div> <div id="tab-notifications" class="tabpane d-none"></div> </div> </div> <script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const TOKEN_KEY = "codeai_admin_token";
  const esc = (s)=>String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");

  function showLogin(msg){
    $("loginCard")?.classList.remove("d-none");
    $("app")?.classList.add("d-none");
    if($("loginMsg")) $("loginMsg").textContent = msg || "";
  }
  function showApp(){
    $("loginCard")?.classList.add("d-none");
    $("app")?.classList.remove("d-none");
    if($("loginMsg")) $("loginMsg").textContent = "";
  }
  function doLogout(reason){
    try{ localStorage.removeItem(TOKEN_KEY); }catch(_){}
    showLogin(reason || "로그아웃 되었습니다.");
  }
  function isAuthError(e){
    const m = (e && e.message) ? String(e.message) : "";
    return e?.status===401 || m==="NO_TOKEN" || m==="INVALID_TOKEN" || m.includes("Unauthorized") || m.includes("401");
  }
  async function auth(path, opts){
    try{
      return await CodeAI.authRequest(path, TOKEN_KEY, opts);
    }catch(e){
      if(isAuthError(e)) doLogout("세션이 만료되어 로그아웃되었습니다. 다시 로그인해주세요.");
      throw e;
    }
  }

  async function login(){
    $("loginMsg").textContent = "로그인 중…";
    try{
      const out = await CodeAI.request("/api/v1/admin/auth/login", {
        method:"POST",
        body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value })
      });
      localStorage.setItem(TOKEN_KEY, out.token);
      showApp();
      $("loginMsg").textContent = "";
      await openTab("enrollments");
    }catch(e){
      $("loginMsg").textContent = "로그인 실패: " + (e?.message || "아이디/비밀번호를 확인해주세요.");
    }
  }

  function setActiveTab(name){
    ["enrollments","instructors","weekly","reports","instApps","students","notifications"].forEach(t=>{
      const panel = $("tab-"+t);
      if(panel) panel.classList.add("d-none");
      const b = document.querySelector(`button[data-tab="${t}"]`);
      b?.classList.remove("active");
    });
    $("tab-"+name)?.classList.remove("d-none");
    document.querySelector(`button[data-tab="${name}"]`)?.classList.add("active");
  }

  async function openTab(name){
    setActiveTab(name);
    if(name==="enrollments") return loadEnrollments();
    if(name==="instructors") return loadInstructors();
    if(name==="instApps") return loadInstructorApps();
    if(name==="students") return loadStudents();
    // others
    const wrap = $("tab-"+name);
    if(wrap) wrap.innerHTML = `<div class="text-muted small">준비중</div>`;
  }

  document.querySelectorAll("button[data-tab]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      const name = btn.getAttribute("data-tab");
      openTab(name);
    });
  });

  async function loadEnrollments(){
    const wrap = $("tab-enrollments");
    if(!wrap) return;
    wrap.innerHTML = `
      <div class="d-flex gap-2 align-items-end mb-2">
        <div class="flex-grow-1">
          <label class="form-label mb-1">검색</label>
          <input id="enrSearch" class="form-control" placeholder="학생/전화/강사/이메일" />
        </div>
        <button id="btnEnrSearch" class="btn btn-outline-primary">조회</button>
      </div>
      <div id="enrMsg" class="small text-muted mb-2"></div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr class="text-muted">
            <th style="width:70px">ID</th><th>학생</th><th>강사</th><th style="width:120px">상태</th><th style="width:140px">액션</th>
          </tr></thead>
          <tbody id="enrBody"></tbody>
        </table>
      </div>
    `;
    const run = async ()=>{
      const q = $("enrSearch").value.trim();
      $("enrMsg").textContent = "불러오는 중…";
      try{
        const out = await auth("/api/v1/admin/enrollments" + (q?("?search="+encodeURIComponent(q)):""), { method:"GET" });
        const list = out.list || [];
        $("enrBody").innerHTML = list.map(r=>`
          <tr>
            <td class="mono">${r.id}</td>
            <td><b>${esc(r.student_name)}</b><div class="small text-muted mono">${esc(r.student_phone||"")}</div></td>
            <td><b>${esc(r.instructor_name)}</b><div class="small text-muted mono">${esc(r.instructor_email||"")}</div></td>
            <td>${esc(r.status||"")}</td>
            <td><a class="btn btn-sm btn-outline-primary" href="portal.html?enrollment_id=${encodeURIComponent(r.id)}">포털</a></td>
          </tr>
        `).join("");
        $("enrMsg").textContent = `총 ${list.length}건`;
      }catch(e){
        $("enrMsg").textContent = "오류: " + (e?.message || "ERROR");
      }
    };
    $("btnEnrSearch").addEventListener("click",(e)=>{ e.preventDefault(); run(); });
    $("enrSearch").addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); run(); } });
    await run();
  }

  async function loadInstructors(){
    const wrap = $("tab-instructors");
    if(!wrap) return;
    wrap.innerHTML = `
      <div class="d-flex gap-2 align-items-end mb-2">
        <div class="flex-grow-1">
          <label class="form-label mb-1">검색</label>
          <input id="insSearch" class="form-control" placeholder="이름/이메일/전화" />
        </div>
        <button id="btnInsSearch" class="btn btn-outline-primary">조회</button>
      </div>
      <div id="insMsg" class="small text-muted mb-2"></div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr class="text-muted">
            <th style="width:70px">ID</th><th>강사</th><th style="width:120px">상태</th><th style="width:120px">메인</th><th style="width:140px">액션</th>
          </tr></thead>
          <tbody id="insBody"></tbody>
        </table>
      </div>
    `;
    const run = async ()=>{
      const q = $("insSearch").value.trim();
      $("insMsg").textContent="불러오는 중…";
      try{
        const out = await auth("/api/v1/admin/instructors" + (q?("?search="+encodeURIComponent(q)):""), { method:"GET" });
        const list = out.instructors || [];
        $("insBody").innerHTML = list.map(i=>`
          <tr>
            <td class="mono">${i.id}</td>
            <td><a href="admin-instructor-detail.html?id=${encodeURIComponent(i.id)}"><b>${esc(i.name)}</b></a>
              <div class="small text-muted mono">${esc(i.email||"")}</div>
              <div class="small text-muted mono">${esc(i.phone||"")}</div>
            </td>
            <td>${esc(i.status||"")}</td>
            <td>${i.is_featured ? "✅" : ""}</td>
            <td><a class="btn btn-sm btn-outline-primary" href="admin-instructor-detail.html?id=${encodeURIComponent(i.id)}">상세</a></td>
          </tr>
        `).join("");
        $("insMsg").textContent = `총 ${list.length}명`;
      }catch(e){
        $("insMsg").textContent = "오류: " + (e?.message || "ERROR");
      }
    };
    $("btnInsSearch").addEventListener("click",(e)=>{ e.preventDefault(); run(); });
    $("insSearch").addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); run(); }});
    await run();
  }

  async function loadInstructorApps(){
    const wrap = $("tab-instApps");
    if(!wrap) return;
    wrap.innerHTML = `
      <div class="d-flex gap-2 align-items-end mb-2">
        <div class="flex-grow-1">
          <label class="form-label mb-1">검색</label>
          <input id="iaSearch" class="form-control" placeholder="이름/이메일/전화" />
        </div>
        <button id="btnIASearch" class="btn btn-outline-primary">조회</button>
      </div>
      <div id="iaMsg" class="small text-muted mb-2"></div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr class="text-muted">
            <th style="width:70px">ID</th><th>강사</th><th style="width:140px">액션</th>
          </tr></thead>
          <tbody id="iaBody"></tbody>
        </table>
      </div>
    `;
    const run = async ()=>{
      const q = $("iaSearch").value.trim();
      $("iaMsg").textContent="불러오는 중…";
      try{
        const out = await auth("/api/v1/admin/instructor-applications" + (q?("?search="+encodeURIComponent(q)):""), { method:"GET" });
        const list = out.list || out.applications || [];
        $("iaBody").innerHTML = list.map(r=>`
          <tr>
            <td class="mono">${r.id}</td>
            <td><a href="admin-instructor-app-detail.html?id=${encodeURIComponent(r.id)}"><b>${esc(r.name||"")}</b></a>
              <div class="small text-muted mono">${esc(r.email||"")}</div>
              <div class="small text-muted mono">${esc(r.phone||"")}</div>
            </td>
            <td><a class="btn btn-sm btn-outline-primary" href="admin-instructor-app-detail.html?id=${encodeURIComponent(r.id)}">상세</a></td>
          </tr>
        `).join("");
        $("iaMsg").textContent = `총 ${list.length}건`;
      }catch(e){
        $("iaMsg").textContent = "오류: " + (e?.message || "ERROR");
      }
    };
    $("btnIASearch").addEventListener("click",(e)=>{ e.preventDefault(); run(); });
    $("iaSearch").addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); run(); }});
    await run();
  }

  async function loadStudents(){
    const wrap = $("tab-students");
    if(!wrap) return;
    wrap.innerHTML = `
      <div class="d-flex gap-2 align-items-end mb-2">
        <div class="flex-grow-1">
          <label class="form-label mb-1">검색</label>
          <input id="saSearch" class="form-control" placeholder="이름/전화" />
        </div>
        <button id="btnSaSearch" class="btn btn-outline-primary">조회</button>
      </div>
      <div id="saMsg" class="small text-muted mb-2"></div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr class="text-muted">
            <th style="width:70px">ID</th><th>이름</th><th style="width:140px">전화</th><th style="width:120px">상태</th><th style="width:140px">액션</th>
          </tr></thead>
          <tbody id="saBody"></tbody>
        </table>
      </div>
    `;
    const run = async ()=>{
      const q = $("saSearch").value.trim();
      $("saMsg").textContent="불러오는 중…";
      try{
        const out = await auth("/api/v1/admin/student-applications" + (q?("?search="+encodeURIComponent(q)):""), { method:"GET" });
        const list = out.list || [];
        $("saBody").innerHTML = list.map(r=>`
          <tr>
            <td class="mono">${r.id}</td>
            <td><a href="admin-student-detail.html?id=${encodeURIComponent(r.id)}"><b>${esc(r.name||"")}</b></a></td>
            <td class="mono small">${esc(r.phone||"")}</td>
            <td>${esc(r.status||"")}</td>
            <td><a class="btn btn-sm btn-outline-primary" href="admin-student-detail.html?id=${encodeURIComponent(r.id)}">상세</a></td>
          </tr>
        `).join("");
        $("saMsg").textContent = `총 ${list.length}건`;
      }catch(e){
        $("saMsg").textContent = "오류: " + (e?.message || "ERROR");
      }
    };
    $("btnSaSearch").addEventListener("click",(e)=>{ e.preventDefault(); run(); });
    $("saSearch").addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); run(); }});
    await run();
  }

  $("btnLogin")?.addEventListener("click",(e)=>{ e.preventDefault(); login(); });
  $("btnLogout")?.addEventListener("click",(e)=>{ e.preventDefault(); doLogout(); });

  (async ()=>{
    if(localStorage.getItem(TOKEN_KEY)){
      showApp();
      try{ await openTab("enrollments"); }catch(e){ /* auth handles */ }
    }else{
      showLogin();
    }
  })();
})();
</script>
</body>
</html>
