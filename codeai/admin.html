<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const TOKEN_KEY = "codeai_admin_token";
const STUDENT_PREF_KO = {
  "ANY":"무관",
  "COLLEGE":"대학생",
  "EMPLOYEE":"직장인",
  "FREELANCER":"프리랜서",
  "FULLTIME_TUTOR":"전업강사",
  "OTHER":"기타"
};
const STUDENT_STATUS_KO = {
  "SUBMITTED":"신청",
  "MATCHING":"매칭중",
  "INSTRUCTOR_SELECTED":"강사선택",
  "ENROLLED":"등록",
  "CANCELLED":"취소"
};
const MODE_KO = {
  "ZOOM":"온라인(줌)",
  "OFFLINE_1_1":"대면 1:1",
  "OFFLINE_GROUP":"대면 그룹"
};
const INSTRUCTOR_TYPE_KO = STUDENT_PREF_KO;
const INSTRUCTOR_STATUS_KO = {
  "ACTIVE":"활동",
  "SUSPENDED":"정지"
};
const APP_STATUS_KO = {
  "PENDING":"대기",
  "APPROVED":"승인",
  "REJECTED":"반려"
};
function toKo(map, v){
  if(v===null||v===undefined||v==="") return "-";
  return map[String(v)] || String(v);
}
function fmtDT(v){
  if(v===null||v===undefined||v==="") return "-";
  try{
    const d = (v instanceof Date) ? v : new Date(v);
    if(Number.isNaN(d.getTime())){
      return String(v).replace("T"," ").slice(0,16);
    }
    const pad = (n)=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }catch(e){
    return String(v).replace("T"," ").slice(0,16);
  }
}

function loadState(key, fallback){
  try{
    return Object.assign({}, fallback||{}, JSON.parse(localStorage.getItem(key)||"{}"));
  }catch(e){
    return Object.assign({}, fallback||{});
  }
}
function saveState(key, st){
  try{ localStorage.setItem(key, JSON.stringify(st||{})); }catch(e){}
}

function showLogin(msg){
  $("loginCard").classList.remove("d-none");
  $("app").classList.add("d-none");
  $("btnLogout")?.classList.add("d-none");
  if(msg) $("loginMsg").textContent = msg;
}
function showApp(){
  $("loginCard").classList.add("d-none");
  $("app").classList.remove("d-none");
  $("btnLogout")?.classList.remove("d-none");
  $("loginMsg").textContent = "";
}

function doLogout(reason){
  try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  // 로그인 화면으로 전환
  try{ showLogin(reason || "로그아웃 되었습니다."); }catch(e){}
}

// ---- 안전장치: 스택 오버플로우(무한 재귀) 발생 시 자동 로그아웃 + 로그인 화면 ----
function isMaxCallStack(err){
  const msg = (err && (err.message || err.toString())) ? String(err.message || err.toString()) : "";
  return /Maximum call stack size exceeded/i.test(msg);
}

window.addEventListener("error", function(ev){
  try{
    const err = ev && (ev.error || ev);
    if(isMaxCallStack(err)){
      doLogout("오류가 발생하여 로그아웃되었습니다. (Maximum call stack)");
    }
  }catch(e){}
});

window.addEventListener("unhandledrejection", function(ev){
  try{
    const err = ev && (ev.reason || ev);
    if(isMaxCallStack(err)){
      doLogout("오류가 발생하여 로그아웃되었습니다. (Maximum call stack)");
    }
  }catch(e){}
});


function isAuthError(e){
  const m = (e && e.message) ? String(e.message) : "";
  return m==="NO_TOKEN" || m==="INVALID_TOKEN" || m.includes("INVALID_TOKEN") || m.includes("NO_TOKEN") || m.includes("Unauthorized") || m.includes("401");
}

async function auth(path, opts){
  try {
    return await CodeAI.authRequest(path, TOKEN_KEY, opts);
  } catch(e) {
    if(isAuthError(e)){
      doLogout("세션이 만료되어 로그아웃되었습니다. 다시 로그인해주세요.");
    }
    throw e;
  }
}
  const esc = (s)=>String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  function snip(v, n=18){
    const s = String(v||"").replace(/\s+/g," ").trim();
    if(!s) return "";
    return s.length>n ? (s.slice(0,n)+"…") : s;
  }

function downloadCSV(filename, columns, rows){
  const escCell = (v)=>{
    const s = String(v ?? "");
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  };
  const header = columns.map(c=>escCell(c.label)).join(",");
  const body = rows.map(r=>columns.map(c=>escCell(r[c.key])).join(",")).join("\n");
  const csv = "\ufeff" + header + "\n" + body; // BOM for Excel
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}


  function setActiveTab(name){
    ["enrollments","instructors","weekly","reports","instApps","students"].forEach(t=>{
      $("tab-"+t).classList.add("d-none");
      document.querySelector(`button[data-tab="${t}"]`).classList.remove("active");
    });
    $("tab-"+name).classList.remove("d-none");
    document.querySelector(`button[data-tab="${name}"]`).classList.add("active");
  }

  document.querySelectorAll("button[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const name = btn.getAttribute("data-tab");
      setActiveTab(name);
      if(name==="enrollments") loadEnrollments();
      if(name==="instructors") loadInstructors();
      if(name==="weekly") loadWeekly();
      if(name==="reports") loadReports();
      if(name==="instApps") loadInstructorApps();
      if(name==="students") loadStudents();
    });
  });

  async function login(){
    $("loginMsg").textContent = "로그인 중…";
    try{
      const out = await CodeAI.request("/api/v1/admin/auth/login", {
        method:"POST",
        body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value })
      });
      localStorage.setItem(TOKEN_KEY, out.token);
      showApp();
      $("loginMsg").textContent = "";
      await loadEnrollments();
    }catch(e){
      $("loginMsg").textContent = "로그인 실패: " + (e.message || "아이디/비밀번호를 확인해주세요.");
    }
  }
  $("btnLogin").addEventListener("click", login);
  $("btnLogout")?.addEventListener("click", (e)=>{ e.preventDefault(); doLogout(); });

  // ---------- Enrollments / Assign / Portal code ----------
  async function loadEnrollments(){
    const wrap = $("tab-enrollments");
    wrap.innerHTML = `
      <div class="d-flex gap-2 align-items-end mb-2">
        <div class="flex-grow-1">
          <label class="form-label mb-1">통합검색(학생/전화/강사/이메일)</label>
          <input id="enrSearch" class="form-control" placeholder="예) 학생01, 010, teacher01, 강사" />
        </div>
        <div>
          <button id="btnEnrSearch" class="btn btn-outline-primary">검색</button>
        </div>
      </div>
      <div id="enrMsg" class="small muted mb-2"></div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
            <tr class="muted">
              <th style="width:70px">ID</th>
              <th>학생</th>
              <th>강사</th>
              <th style="width:120px">상태</th>
              <th style="width:160px">학부모코드</th>
              <th style="width:260px">액션</th>
            </tr>
          </thead>
          <tbody id="enrBody"></tbody>
        </table>
      </div>
    `;
    const searchInput = document.getElementById("enrSearch");
    const run = async ()=>{
      const q = searchInput.value.trim();
      document.getElementById("enrMsg").textContent = "불러오는 중…";
      try{
        const out = await auth("/api/v1/admin/enrollments" + (q ? ("?search="+encodeURIComponent(q)) : ""), { method:"GET" });
        const list = out.list || [];
        const tb = document.getElementById("enrBody");
        tb.innerHTML = list.map(r=>{
          const issued = r.last_code_issued_at ? new Date(r.last_code_issued_at).toLocaleString() : "-";
          return `
            <tr data-eid="${r.id}">
              <td class="mono">${r.id}</td>
              <td>
                <div><b>${esc(r.student_name)}</b></div>
                <div class="small muted mono">${esc(r.student_phone || "")}</div>
              </td>
              <td>
                <div><b>${esc(r.instructor_name)}</b> ${r.is_featured ? '<span class="badge text-bg-warning">메인</span>' : ''}</div>
                <div class="small muted mono">${esc(r.instructor_email || "")}</div>
              </td>
              <td><span class="badge text-bg-secondary">${esc(r.status)}</span></td>
              <td class="small">
                <div class="muted">최근 발급</div>
                <div class="mono">${esc(issued)}</div>
              </td>
              <td class="row-actions">
                <button class="btn btn-sm btn-outline-secondary smallbtn" data-act="assign">강사배정</button>
                <button class="btn btn-sm btn-outline-primary smallbtn" data-act="logs">코드 다시보기(로그)</button>
                <button class="btn btn-sm btn-primary smallbtn" data-act="reissue">코드 재발급</button>
              </td>
            </tr>
            <tr class="d-none" data-panel="${r.id}">
              <td colspan="6">
                <div class="card p-2">
                  <div class="small muted">패널</div>
                  <div id="panel-${r.id}"></div>
                </div>
              </td>
            </tr>
          `;
        }).join("");
        document.getElementById("enrMsg").textContent = `총 ${list.length}건`;
      }catch(e){
        document.getElementById("enrMsg").textContent = "오류: " + e.message;
      }
    };

    document.getElementById("btnEnrSearch").addEventListener("click", run);
    searchInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") run(); });
    await run();

    wrap.addEventListener("click", async (e)=>{
      const btn = e.target.closest("button[data-act]");
      if(!btn) return;
      const tr = e.target.closest("tr[data-eid]");
      if(!tr) return;
      const eid = tr.getAttribute("data-eid");
      const act = btn.getAttribute("data-act");
      const panelRow = wrap.querySelector(`tr[data-panel="${eid}"]`);
      const panel = document.getElementById("panel-" + eid);

      panelRow.classList.remove("d-none");
      panel.innerHTML = "불러오는 중…";

      if(act==="logs"){
        try{
          const out = await auth(`/api/v1/admin/enrollments/${eid}/portal-code/logs`, { method:"GET" });
          const logs = out.logs || [];
          panel.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div><b>학부모코드 로그</b> <span class="muted small">(ISSUE에만 원본 코드가 저장됩니다)</span></div>
              <button class="btn btn-sm btn-outline-secondary smallbtn" data-close="${eid}">닫기</button>
            </div>
            <div class="table-responsive">
              <table class="table table-sm">
                <thead><tr class="muted"><th>시간</th><th>타입</th><th>코드(원본)</th><th>Actor</th></tr></thead>
                <tbody>
                  ${logs.map(l=>`
                    <tr>
                      <td class="small mono">${esc(new Date(l.created_at).toLocaleString())}</td>
                      <td><span class="badge text-bg-${l.event_type==='ISSUE'?'primary':'secondary'}">${esc(l.event_type)}</span></td>
                      <td class="mono">${l.event_type==='ISSUE' ? esc(l.code_value||"-") : "-"}</td>
                      <td class="small">${esc(l.actor_role||"")}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `;
        }catch(err){
          panel.innerHTML = "오류: " + err.message;
        }
      }

      if(act==="reissue"){
        try{
          const out = await auth(`/api/v1/admin/enrollments/${eid}/portal-code/reissue`, { method:"POST", body: "{}" });
          panel.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div><b>재발급 완료</b></div>
              <button class="btn btn-sm btn-outline-secondary smallbtn" data-close="${eid}">닫기</button>
            </div>
            <div class="kv">
              <div class="muted">새 코드</div><div class="mono"><b>${esc(out.code)}</b></div>
              <div class="muted">만료</div><div class="mono">${esc(out.expires_at)}</div>
            </div>
            <div class="small muted mt-2">※ 이 코드는 ISSUE 로그에도 저장되어 “다시보기”가 가능합니다.</div>
          `;
          await loadEnrollments();
        }catch(err){
          panel.innerHTML = "오류: " + err.message;
        }
      }

      if(act==="assign"){
        try{
          const out = await auth(`/api/v1/admin/instructors`, { method:"GET" });
          const list = out.instructors || [];
          panel.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div><b>강사 배정/변경</b></div>
              <button class="btn btn-sm btn-outline-secondary smallbtn" data-close="${eid}">닫기</button>
            </div>
            <div class="row g-2 align-items-end">
              <div class="col-md-6">
                <label class="form-label mb-1">강사 검색</label>
                <input class="form-control" id="assignSearch-${eid}" placeholder="이름/이메일/전화" />
              </div>
              <div class="col-md-6">
                <label class="form-label mb-1">강사 선택</label>
                <select class="form-select" id="assignSel-${eid}">
                  ${list.map(i=>`<option value="${i.id}">${esc(i.name)} ${i.is_featured ? "[메인]" : ""} (${esc(i.email||"")})</option>`).join("")}
                </select>
              </div>
              <div class="col-md-12 d-grid">
                <button class="btn btn-primary" id="assignBtn-${eid}">이 강사로 배정</button>
              </div>
            </div>
            <div class="small muted mt-2" id="assignMsg-${eid}"></div>
          `;
          const sel = document.getElementById(`assignSel-${eid}`);
          const sInput = document.getElementById(`assignSearch-${eid}`);
          sInput.addEventListener("input", async ()=>{
            const q = sInput.value.trim();
            const o2 = await auth(`/api/v1/admin/instructors` + (q ? ("?search="+encodeURIComponent(q)) : ""), { method:"GET" });
            const l2 = o2.instructors || [];
            sel.innerHTML = l2.map(i=>`<option value="${i.id}">${esc(i.name)} ${i.is_featured ? "[메인]" : ""} (${esc(i.email||"")})</option>`).join("");
          });
          document.getElementById(`assignBtn-${eid}`).addEventListener("click", async ()=>{
            document.getElementById(`assignMsg-${eid}`).textContent = "배정 중…";
            try{
              await auth(`/api/v1/admin/enrollments/${eid}/assign-instructor`, {
                method:"POST",
                body: JSON.stringify({ instructorId: Number(sel.value) })
              });
              document.getElementById(`assignMsg-${eid}`).textContent = "완료";
              await loadEnrollments();
            }catch(err){
              document.getElementById(`assignMsg-${eid}`).textContent = "오류: " + err.message;
            }
          });
        }catch(err){
          panel.innerHTML = "오류: " + err.message;
        }
      }
    });

    wrap.addEventListener("click", (e)=>{
      const c = e.target.closest("button[data-close]");
      if(!c) return;
      const eid = c.getAttribute("data-close");
      const panelRow = wrap.querySelector(`tr[data-panel="${eid}"]`);
      if(panelRow) panelRow.classList.add("d-none");
    });
  }

          <tbody id="wrBody"></tbody>

      </div>

      try{

        if(st) qs.push("status="+encodeURIComponent(st));
        if(q) qs.push("search="+encodeURIComponent(q));
        const out = await auth(`/api/v1/admin/weekly-reports` + (qs.length ? ("?"+qs.join("&")) : ""), { method:"GET" });
        const list = out.list || [];
        document.getElementById("wrBody").innerHTML = list.map(r=>{
          const metrics = r.metrics_json ? (typeof r.metrics_json === "string" ? JSON.parse(r.metrics_json) : r.metrics_json) : null;
          const line = metrics ? `출석:${metrics.attendance||"-"} 숙제:${metrics.homework_done||"-"} 집중:${metrics.focus||"-"}` : "-";
          return `
            <tr>
              <td class="mono">${esc(r.week_start_date)}</td>
              <td>

                <div class="small muted mono">${esc(r.student_phone||"")}</div>
              </td>
              <td>${esc(r.instructor_name||"")}</td>
              <td class="small">${esc(line)}</td>
              <td><span class="badge text-bg-${r.admin_status==='APPROVED'?'success':(r.admin_status==='REJECTED'?'danger':'secondary')}">${esc(r.admin_status)}</span></td>
              <td class="row-actions">
                <button class="btn btn-sm btn-outline-secondary smallbtn" data-view="${r.id}">보기</button>
                <button class="btn btn-sm btn-success smallbtn" data-approve="${r.id}">승인</button>
                <button class="btn btn-sm btn-danger smallbtn" data-reject="${r.id}">반려</button>

            </tr>
            <tr class="d-none" data-wrpanel="${r.id}">
              <td colspan="6">
                <div class="card p-2">
                  <div class="d-flex justify-content-between align-items-center">
                    <div><b>상세</b></div>
                    <button class="btn btn-sm btn-outline-secondary smallbtn" data-wrclose="${r.id}">닫기</button>
                  </div>
                  <pre class="small mt-2 mb-0" style="white-space:pre-wrap;">${esc(JSON.stringify(r, null, 2))}</pre>
                </div>
              </td>
            </tr>
          `;
        }).join("");
        document.getElementById("wrMsg").textContent = `총 ${list.length}건`;
      }catch(e){
        document.getElementById("wrMsg").textContent = "오류: " + e.message;
      }
    };
    document.getElementById("btnWrSearch").addEventListener("click", run);
    document.getElementById("wrSearch").addEventListener("keydown", (e)=>{ if(e.key==="Enter") run(); });
    wrap.addEventListener("click", async (e)=>{
      const view = e.target.closest("button[data-view]");
      const close = e.target.closest("button[data-wrclose]");
      const ap = e.target.closest("button[data-approve]");
      const rj = e.target.closest("button[data-reject]");

      if(view){
        const id = view.getAttribute("data-view");
        const row = wrap.querySelector(`tr[data-wrpanel="${id}"]`);
        if(row) row.classList.remove("d-none");
        return;
      }
      if(close){
        const id = close.getAttribute("data-wrclose");
        const row = wrap.querySelector(`tr[data-wrpanel="${id}"]`);
        if(row) row.classList.add("d-none");
        return;
      }
      if(ap || rj){
        const id = (ap||rj).getAttribute(ap ? "data-approve" : "data-reject");
        const status = ap ? "APPROVED" : "REJECTED";
        const note = prompt(status==="APPROVED" ? "승인 메모(선택)" : "반려 사유(선택)", "") || "";
        try{
          await auth(`/api/v1/admin/weekly-reports/${id}/review`, {
            method:"POST",
            body: JSON.stringify({ status, note })
          });
          await run();
        }catch(err){
          alert("실패: " + err.message);
        }
      }
    });
    await run();
  }

    </div>

    <div id="saMsg" class="small muted mb-2"></div>
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead><tr class="muted">
          <th style="width:70px">ID</th>
          <th>이름</th>
          <th style="width:120px">전화</th>
          <th style="width:120px">수업방식</th>
          <th style="width:120px">선호타입</th>
          <th style="width:90px">상태</th>
          <th style="width:140px">최초신청일</th>
          <th style="width:140px">상태변경일</th>
          <th>비고</th>
          <th style="width:90px">강사</th>
          <th style="width:140px">액션</th>
        </tr></thead>
        <tbody id="saBody"></tbody>
      </table>
    </div>
  `;

  document.getElementById("saStatus").value = st.status || "";
  document.getElementById("saMode").value = st.mode || "";
  document.getElementById("saSortBy").value = st.sortBy || "created_at";
  document.getElementById("saSortDir").value = st.sortDir || "DESC";

  const run = async ()=>{
    const q = document.getElementById("saSearch").value.trim();
    const status = document.getElementById("saStatus").value;
    const mode = document.getElementById("saMode").value;
    const sortBy = document.getElementById("saSortBy").value;
    const sortDir = document.getElementById("saSortDir").value;

    saveState(STATE_KEY, { search:q, status, mode, sortBy, sortDir });

    document.getElementById("saMsg").textContent = "불러오는 중…";
    try{
      const qs = [];
      if(q) qs.push("search="+encodeURIComponent(q));
      if(status) qs.push("status="+encodeURIComponent(status));
      if(mode) qs.push("mode="+encodeURIComponent(mode));
      if(sortBy) qs.push("sortBy="+encodeURIComponent(sortBy));
      if(sortDir) qs.push("sortDir="+encodeURIComponent(sortDir));
      const out = await auth("/api/v1/admin/student-applications" + (qs.length?("?"+qs.join("&")):""), { method:"GET" });
      const list = out.list || [];
      document.getElementById("saBody").innerHTML = list.map(r=>`
        <tr>
          <td class="mono">${r.id}</td>
          <td><a href="admin-student-detail.html?id=${encodeURIComponent(r.id)}"><b>${esc(r.name)}</b></a></td>
          <td class="mono small">${esc(r.phone||"")}</td>
          <td class="small">${esc(toKo(MODE_KO, r.mode||"-"))}</td>
          <td class="small">${esc(toKo(STUDENT_PREF_KO, r.preferred_instructor_type||"-"))}</td>
          <td>${esc(toKo(STUDENT_STATUS_KO, r.status||"-"))}</td>
          <td class="mono small">${esc(fmtDT(r.created_at))}</td>
          <td class="mono small">${esc(fmtDT(r.status_changed_at))}</td>
          <td class="small" title="${esc(String(r.admin_note||"").replace(/\s+/g," ").trim())}">${esc(snip(r.admin_note))}</td>
          <td class="small">${esc(r.selected_instructor_name ? snip(r.selected_instructor_name, 8) : "-")}</td>
          <td class="row-actions">
            <button class="btn btn-sm btn-outline-secondary smallbtn" data-copy="${esc(r.phone||"")}">전화</button>
            <a class="btn btn-sm btn-outline-primary smallbtn" href="admin-student-detail.html?id=${encodeURIComponent(r.id)}">상세</a>
          </td>
        </tr>
      `).join("");
      document.getElementById("saMsg").textContent = `총 ${list.length}건`;
      wrap._lastStudents = list;
    }catch(e){
      document.getElementById("saMsg").textContent = "오류: " + e.message;
    }
  };

  document.getElementById("btnSaSearch").addEventListener("click", run);
  document.getElementById("saSearch").addEventListener("keydown", (e)=>{ if(e.key==="Enter") run(); });
  ["saStatus","saMode","saSortBy","saSortDir"].forEach(id=>{
    document.getElementById(id).addEventListener("change", ()=>run());
  });

  wrap.addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-copy]");
    if(!btn) return;
    const val = btn.getAttribute("data-copy") || "";
    if(val) navigator.clipboard.writeText(val);
    const old = btn.textContent;
    btn.textContent = "복사됨";
    setTimeout(()=>btn.textContent=old, 700);
  });

  document.getElementById("btnSaCSV").addEventListener("click", ()=>{
    const list = wrap._lastStudents || [];
    downloadCSV("student_applications.csv", [
      { key:"id", label:"ID" },
      { key:"name", label:"이름" },
      { key:"phone", label:"전화" },
      { key:"mode_ko", label:"수업방식" },
      { key:"preferred_ko", label:"선호타입" },
      { key:"status_ko", label:"상태" },
      { key:"created_at", label:"최초신청일" },
      { key:"status_changed_at", label:"상태변경일" },
      { key:"selected_instructor_name", label:"선택강사" },
      { key:"admin_note", label:"비고" }
    ], list.map(x=>({
      ...x,
      mode_ko: toKo(MODE_KO, x.mode||"-"),
      preferred_ko: toKo(STUDENT_PREF_KO, x.preferred_instructor_type||"-"),
      status_ko: toKo(STUDENT_STATUS_KO, x.status||"-"),
      created_at: fmtDT(x.created_at),
      status_changed_at: fmtDT(x.status_changed_at)
    })));
  });

  await run();
}

// Auto-login if token exists

  (async ()=>{
    if(localStorage.getItem(TOKEN_KEY)){
      showApp();
      await loadEnrollments();
    }
  })();

})();
</script>
</body>
</html>
